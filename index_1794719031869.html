  <title>XOX BY WACOWILD — Get Drop Alerts</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #050505; color: #f5f5f5;
      font-family: "Courier New", Courier, monospace; display: grid; place-items: center;
      padding: 28px 18px;
    }
    main { width: min(100%, 520px); text-align: center; }
    .mark { width: 112px; height: 112px; object-fit: contain; margin: 0 auto 34px; display: block; }
    .eyebrow { color: #999; font-size: 11px; letter-spacing: .22em; margin: 0 0 18px; }
    h1 { font-size: clamp(38px, 9vw, 64px); line-height: .98; letter-spacing: -.07em; margin: 0; font-weight: 700; }
    h1 span { display: block; color: #8d8d8d; font-size: .52em; letter-spacing: .02em; margin-top: 12px; }
    .intro { color: #aaa; font-size: 13px; line-height: 1.8; max-width: 390px; margin: 26px auto 34px; }
    form { display: flex; gap: 8px; width: 100%; }
    input {
      min-width: 0; flex: 1; background: #111; color: white; border: 1px solid #444;
      border-radius: 0; padding: 16px 14px; font: 12px "Courier New", monospace; outline: none;
    }
    input:focus { border-color: #fff; }
    button {
      background: #f5f5f5; color: #050505; border: 1px solid #f5f5f5; padding: 0 17px;
      font: 700 11px "Courier New", monospace; letter-spacing: .06em; cursor: pointer;
    }
    button:hover { background: #cfcfcf; }
    .privacy { color: #666; font-size: 10px; line-height: 1.6; margin: 14px 0 0; }
    .footer { color: #555; font-size: 10px; letter-spacing: .16em; margin-top: 58px; }
    .line { width: 34px; height: 1px; background: #555; margin: 28px auto; }
    @media (max-width: 420px) {
      form { flex-direction: column; }
      button { min-height: 48px; }
    }
  </style>
